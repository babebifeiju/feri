<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <!-- Public link previews are read from the HTML sent by Vercel before JavaScript runs. -->
    <title>Charmy | Tarot &amp; Commission</title>
    <meta name="description" content="Charmy — บริการดูดวง Tarot และงาน Commission ดูสินค้า รีวิวลูกค้า เช็กคิวงาน และสิทธิพิเศษของสมาชิก">
    <meta property="og:type" content="website">
    <meta property="og:site_name" content="Charmy">
    <meta property="og:title" content="Charmy | Tarot &amp; Commission">
    <meta property="og:description" content="Charmy — บริการดูดวง Tarot และงาน Commission ดูสินค้า รีวิวลูกค้า เช็กคิวงาน และสิทธิพิเศษของสมาชิก">
    <meta property="og:url" content="https://lunacharmy.vercel.app/">
    <meta name="twitter:card" content="summary">
    <meta name="twitter:title" content="Charmy | Tarot &amp; Commission">
    <meta name="twitter:description" content="Charmy — บริการดูดวง Tarot และงาน Commission ดูสินค้า รีวิวลูกค้า เช็กคิวงาน และสิทธิพิเศษของสมาชิก">
    
    <!-- Vue 3 -->
    <script src="https://unpkg.com/vue@3/dist/vue.global.prod.js"></script>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;0,700;1,400&family=Great+Vibes&family=Mali:wght@400;500;600&family=Noto+Sans+Thai:wght@400;500;600&display=swap" rel="stylesheet">

    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        'site-bg': 'var(--color-site-bg, #FFF9F8)',
                        'surface-primary': 'var(--color-surface-primary, #FFFDFD)',
                        'surface-secondary': 'var(--color-surface-secondary, #FBE8EE)',
                        'primary': 'var(--color-primary, #704451)',
                        'accent': 'var(--color-accent, #EADDF1)',
                        'text-primary': 'var(--color-text-primary, #795365)',
                        'text-secondary': 'var(--color-text-secondary, #B78399)',
                        'border-primary': 'var(--color-border-primary, #E8C7D3)',
                        'border-secondary': 'var(--color-border-secondary, #F3D5E2)',
                        'btn-primary': 'var(--color-btn-primary, #704451)',
                        'btn-secondary': 'var(--color-btn-secondary, #FFFDFD)',
                        'icon': 'var(--color-icon, #B78399)',
                        'status': 'var(--color-status, #D4738C)',
                        
                        // Charm CSS Colors
                        'charm-bow': 'var(--color-charm-bow, #FBE8EE)',
                        'charm-bow-border': 'var(--color-charm-bow-border, #E8C7D3)',
                        'charm-string': 'var(--color-charm-string, #D3C1CD)',
                        'charm-bead1': 'var(--color-charm-bead1, #FFFDFD)',
                        'charm-bead2': 'var(--color-charm-bead2, #F3D5E2)',
                        'charm-heart-fill': 'var(--color-charm-heart-fill, #FBE8EE)',
                        'charm-heart-stroke': 'var(--color-charm-heart-stroke, #B78399)',

                        // Legacy mappings
                        'ivory-pink': 'var(--color-site-bg, #FFF9F8)',
                        'milky-pink': 'var(--color-surface-secondary, #FBE8EE)',
                        'baby-pink': 'var(--color-border-secondary, #F3D5E2)',
                        'dusty-rose': 'var(--color-text-secondary, #B78399)',
                        'vintage-plum': 'var(--color-primary, #704451)',
                        'deep-mauve': 'var(--color-text-primary, #795365)',
                        'pearl-white': 'var(--color-surface-primary, #FFFDFD)',
                        'silver': '#C8C8D0',
                        'soft-lavender': 'var(--color-accent, #EADDF1)',
                        'border-pink': 'var(--color-border-primary, #E8C7D3)',
                    },
                    fontFamily: {
                        'script': ['"Great Vibes"', 'cursive'],
                        'serif': ['"Cormorant Garamond"', 'serif'],
                        'thai': ['"Mali"', 'sans-serif'],
                        'sans-thai': ['"Noto Sans Thai"', 'sans-serif'],
                    },
                    boxShadow: {
                        'lace': '0 4px 12px rgba(112, 68, 81, 0.05)',
                        'card-sm': '0 2px 8px rgba(112, 68, 81, 0.04)',
                        'charm': '1px 2px 4px rgba(112, 68, 81, 0.15)',
                    },
                    animation: {
                        'charm-swing': 'charmSwing 5s ease-in-out infinite',
                        'fade-in-up': 'fadeInUp 0.6s cubic-bezier(0.4, 0, 0.2, 1) forwards',
                        'pearl-spin': 'spin 12s linear infinite',
                        'bow-flutter': 'bowFlutter 4s ease-in-out infinite',
                        'star-twinkle': 'starTwinkle 4s ease-in-out infinite',
                        'star-float': 'starFloat 10s ease-in-out infinite',
                    },
                    keyframes: {
                        charmSwing: { 
                            '0%, 100%': { transform: 'rotate(-3deg)' }, 
                            '50%': { transform: 'rotate(3deg)' } 
                        },
                        fadeInUp: { 
                            '0%': { opacity: '0', transform: 'translateY(10px)' }, 
                            '100%': { opacity: '1', transform: 'translateY(0)' } 
                        },
                        bowFlutter: { 
                            '0%, 100%': { transform: 'rotate(-1.5deg)' }, 
                            '50%': { transform: 'rotate(1.5deg)' } 
                        },
                        starTwinkle: {
                            '0%, 100%': { opacity: '0.1', transform: 'scale(0.8)' },
                            '50%': { opacity: '0.45', transform: 'scale(1.2)' }
                        },
                        starFloat: {
                            '0%, 100%': { transform: 'translateY(0px) translateX(0px)' },
                            '50%': { transform: 'translateY(-10px) translateX(3px)' }
                        }
                    }
                }
            }
        }
    </script>

    <style>
        body { 
            font-family: 'Mali', sans-serif; 
            /* Lighten website background slightly by 5-10% */
            background-color: color-mix(in srgb, var(--color-site-bg) 94%, #FFFFFF); 
            color: var(--color-text-primary); 
            overflow-x: hidden; 
            line-height: 1.5;
            -webkit-text-size-adjust: 100%;
        }

        .admin-body { font-family: 'Mali', sans-serif !important; }
        .admin-title-main { font-size: 13px; font-weight: 600; color: var(--color-primary); line-height: 1.2; }
        .admin-title-sub { font-size: 9.5px; font-family: 'Cormorant Garamond', serif; color: var(--color-text-secondary); text-transform: uppercase; letter-spacing: 0.08em; line-height: 1.1; }
        .admin-label { font-size: 12px; font-weight: 500; color: var(--color-text-primary); }
        .admin-input { font-size: 16px !important; padding: 6px 10px; height: 38px; }
        .admin-textarea { font-size: 16px !important; padding: 8px 10px; min-height: 68px; }
        .admin-btn { font-size: 12px !important; padding: 6px 10px; }
        .admin-pill { font-size: 12px !important; padding: 6px 10px; height: 34px; }
        .admin-tab-item { font-size: 12px !important; padding: 6px 12px; height: 36px; white-space: nowrap; flex: 0 0 auto; }

        @media (max-width: 768px) {
            input[type="text"], input[type="search"], input[type="password"], input[type="date"], input[type="number"], select, textarea {
                font-size: 16px !important;
            }
        }

        .scrollbar-hide::-webkit-scrollbar { display: none; }
        .scrollbar-hide { -ms-overflow-style: none; scrollbar-width: none; }
        
        .admin-scroll::-webkit-scrollbar { width: 4px; }
        .admin-scroll::-webkit-scrollbar-track { background: var(--color-site-bg); }
        .admin-scroll::-webkit-scrollbar-thumb { background: var(--color-border-primary); border-radius: 4px; }
        
        .interactive-tap { transition: transform 0.2s ease-in-out, box-shadow 0.2s ease-in-out; position: relative; z-index: 20; }
        .interactive-tap:active { transform: scale(0.97); }
        .hover-lift { transition: transform 0.25s ease-in-out, box-shadow 0.25s ease-in-out; }
        .hover-lift:hover, .hover-lift:active { transform: translateY(-1px); box-shadow: 0 4px 12px rgba(112, 68, 81, 0.05); }

        .bg-milky-paper { position: relative; }
        .bg-milky-paper::before {
            content: "";
            position: fixed; inset: 0; pointer-events: none;
            background-image: url('data:image/svg+xml;utf8,<svg viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg"><filter id="n"><feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="3" stitchTiles="stitch"/></filter><rect width="100%" height="100%" filter="url(%23n)" opacity="0.02"/></svg>'), radial-gradient(rgba(183, 131, 153, 0.08) 1px, transparent 1px);
            background-size: auto, 16px 16px;
            z-index: -1;
        }
        
        .bg-faded-ruled { background-image: repeating-linear-gradient(transparent, transparent 23px, rgba(183, 131, 153, 0.12) 23px, rgba(183, 131, 153, 0.12) 24px); background-attachment: local; }
        
        .shoujo-sparkle-background {
            position: fixed; inset: 0; width: 100%; height: 100%; overflow: hidden; pointer-events: none; z-index: 1;
        }
        .shoujo-star {
            position: absolute; pointer-events: none; animation-iteration-count: infinite; animation-timing-function: ease-in-out;
        }

        .page-enter-active, .page-leave-active { transition: opacity 0.3s ease, transform 0.3s ease; }
        .page-enter-from, .page-leave-to { opacity: 0; transform: translateY(6px); }
        .fade-enter-active, .fade-leave-active { transition: opacity 0.3s ease; }
        .fade-enter-from, .fade-leave-to { opacity: 0; }

        .expand-enter-active, .expand-leave-active {
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            max-height: 1200px;
            overflow: hidden;
        }
        .expand-enter-from, .expand-leave-to {
            max-height: 0;
            opacity: 0;
            padding-top: 0;
            padding-bottom: 0;
        }

        @media (prefers-reduced-motion: reduce) {
            .animate-charm-swing, .animate-bow-flutter, .animate-pearl-spin, .animate-fade-in-up, .shoujo-star, .animate-star-twinkle, .animate-star-float { animation: none !important; }
        }

        /* Semantic Token Isolation & Hardcoded Fixes */
        body { background-color: color-mix(in srgb, var(--color-site-bg) 94%, #FFFFFF) !important; color: var(--color-text-primary) !important; }
        button.bg-vintage-plum { background-color: var(--color-btn-primary) !important; border-color: var(--color-btn-primary) !important; }
        button.bg-pearl-white { background-color: var(--color-btn-secondary) !important; }
        i.text-dusty-rose, svg.text-dusty-rose { color: var(--color-icon) !important; }
        i.text-vintage-plum { color: var(--color-primary) !important; }
    </style>
</head>
<body class="antialiased bg-site-bg text-text-primary overflow-x-hidden relative bg-milky-paper">

<div class="shoujo-sparkle-background" aria-hidden="true">
    <div class="shoujo-star" style="top: 40px; left: 12%; animation: starTwinkle 4.2s infinite, starFloat 12s infinite; animation-delay: 0.2s;">
        <svg viewBox="0 0 10 10" class="w-3 h-3 text-dusty-rose" style="filter: drop-shadow(0 0 3px rgba(243,213,226,0.8));"><path d="M5,0 Q5,5 10,5 Q5,5 5,10 Q5,5 0,5 Q5,5 5,0 Z" fill="currentColor"/></svg>
    </div>
    <div class="shoujo-star" style="top: 110px; right: 15%; animation: starTwinkle 5.5s infinite, starFloat 14s infinite; animation-delay: 1.2s;">
        <svg viewBox="0 0 10 10" class="w-2.5 h-2.5 text-baby-pink" style="filter: drop-shadow(0 0 3px rgba(255,255,255,0.9));"><path d="M5,0 Q5,5 10,5 Q5,5 5,10 Q5,5 0,5 Q5,5 5,0 Z" fill="currentColor"/></svg>
    </div>
    <div class="shoujo-star" style="top: 250px; left: 8%; animation: starTwinkle 6.1s infinite, starFloat 11s infinite; animation-delay: 2.1s;">
        <svg viewBox="0 0 10 10" class="w-3.5 h-3.5 text-soft-lavender"><path d="M5,0 Q5,5 10,5 Q5,5 5,10 Q5,5 0,5 Q5,5 5,0 Z" fill="currentColor"/></svg>
    </div>
    <div class="shoujo-star" style="top: 420px; right: 10%; animation: starTwinkle 4.8s infinite, starFloat 13s infinite; animation-delay: 0.5s;">
        <svg viewBox="0 0 10 10" class="w-3 h-3 text-dusty-rose"><path d="M5,0 Q5,5 10,5 Q5,5 5,10 Q5,5 0,5 Q5,5 5,0 Z" fill="currentColor"/></svg>
    </div>
    <div class="shoujo-star" style="top: 580px; left: 14%; animation: starTwinkle 5.2s infinite, starFloat 15s infinite; animation-delay: 1.8s;">
        <svg viewBox="0 0 10 10" class="w-3.5 h-3.5 text-pearl-white" style="filter: drop-shadow(0 0 3px rgba(255,255,255,0.9));"><path d="M5,0 Q5,5 10,5 Q5,5 5,10 Q5,5 0,5 Q5,5 5,0 Z" fill="currentColor"/></svg>
    </div>
</div>

<svg class="hidden">
    <defs>
        <filter id="charm-shadow" x="-30%" y="-30%" width="160%" height="160%">
            <feDropShadow dx="0.5" dy="1.5" stdDeviation="1.5" flood-color="#704451" flood-opacity="0.12"/>
        </filter>
        <filter id="mini-charm-shadow" x="-20%" y="-20%" width="140%" height="140%">
            <feDropShadow dx="0.5" dy="1" stdDeviation="1" flood-color="#704451" flood-opacity="0.10"/>
        </filter>
        <g id="sparkle-star">
            <path d="M5,0 Q5,5 10,5 Q5,5 5,10 Q5,5 0,5 Q5,5 5,0 Z" fill="currentColor"/>
        </g>
        <g id="satin-bow-pink">
            <path d="M12,12 C4,2 -2,8 2,16 C3,19 9,17 12,12 Z" fill="var(--color-charm-bow, #FBE8EE)" stroke="var(--color-charm-bow-border, #E8C7D3)" stroke-width="0.5"/>
            <path d="M12,12 C20,2 26,8 22,16 C21,19 15,17 12,12 Z" fill="var(--color-charm-bow, #FBE8EE)" stroke="var(--color-charm-bow-border, #E8C7D3)" stroke-width="0.5"/>
            <path d="M11.5,12.5 Q5,20 4,26 L7,26.5 Q10,21 11.5,14" fill="var(--color-charm-bead2, #F3D5E2)" opacity="0.95"/>
            <path d="M12.5,12.5 Q19,20 20,26 L17,26.5 Q14,21 12.5,14" fill="var(--color-charm-bead2, #F3D5E2)" opacity="0.95"/>
            <circle cx="12" cy="12" r="2.5" fill="var(--color-icon, #8C6C7B)" opacity="0.8"/>
        </g>
    </defs>
</svg>

<div id="app" class="flex flex-col min-h-screen w-full relative z-10 overflow-x-hidden transition-colors duration-500">
    <div v-if="!isLoaded" class="fixed inset-0 bg-ivory-pink flex flex-col items-center justify-center z-[9999]">
        <svg viewBox="0 0 24 24" class="w-8 h-8 opacity-70 animate-bow-flutter mb-2"><use href="#satin-bow-pink"></use></svg>
        <span class="text-vintage-plum font-serif text-[11px] tracking-widest uppercase">Loading...</span>
    </div>

    <template v-else>
        <transition name="fade">
            <div v-if="notification" class="fixed top-4 left-1/2 -translate-x-1/2 bg-pearl-white/95 backdrop-blur-sm border border-border-pink text-deep-mauve px-4 py-1.5 rounded-full shadow-lace z-[10000] text-[11px] font-thai flex items-center justify-center gap-1.5 whitespace-nowrap">
                <i class="fas fa-heart text-status text-[9px]"></i>
                {{ notification }}
            </div>
        </transition>

        <!-- RESPONSIVE SHOUJO PRINCESS BOUTIQUE HEADER WITH VERTICAL STRIPES & OPAQUE LABEL -->
        <header class="w-full relative z-40 shrink-0 flex flex-col justify-center overflow-visible shadow-xs" style="min-height: 120px; background-color: color-mix(in srgb, var(--color-surface-secondary) 85%, #FFFFFF); background-image: repeating-linear-gradient(90deg, color-mix(in srgb, var(--color-surface-secondary) 85%, #FFFFFF), color-mix(in srgb, var(--color-surface-secondary) 85%, #FFFFFF) 18px, var(--color-surface-primary) 18px, var(--color-surface-primary) 36px);">
            <!-- Top dainty lace border hanging from very top -->
            <div class="absolute -top-[2px] left-0 w-full h-[14px] z-30 pointer-events-none opacity-90" aria-hidden="true" style="overflow: visible; filter: drop-shadow(0 1px 1px rgba(112,68,81,.06));">
                <svg width="100%" height="14" preserveAspectRatio="none" xmlns="http://www.w3.org/2000/svg" style="display:block; overflow:visible;">
                    <defs>
                        <pattern id="yuki-top-lace" width="20" height="14" patternUnits="userSpaceOnUse">
                            <path d="M0 0 H20 V6 C20 10 15 13 10 13 C5 13 0 10 0 6 Z" :fill="activeTheme.surfacePrimary"/>
                            <path d="M2 6 C4 9 7 11 10 11 C13 11 16 9 18 6" fill="none" :stroke="activeTheme.borderPrimary" stroke-width=".6" stroke-dasharray="1 1"/>
                            <circle cx="10" cy="8" r=".8" :fill="activeTheme.borderPrimary"/>
                        </pattern>
                    </defs>
                    <rect width="100%" height="14" fill="url(#yuki-top-lace)"/>
                </svg>
            </div>

            <div class="absolute inset-0 opacity-[0.03] pointer-events-none" style="background-image: url('data:image/svg+xml;utf8,<svg viewBox=\'0 0 200 200\' xmlns=\'http://www.w3.org/2000/svg\'><filter id=\'n\'><feTurbulence type=\'fractalNoise\' baseFrequency=\'0.8\'/></filter><rect width=\'100%\' height=\'100%\' filter=\'url(%23n)\'/></svg>');"></div>
            
            <!-- Header Grid Container with responsive layout constraints -->
            <div class="w-full max-w-[1200px] mx-auto px-4 md:px-8 lg:px-12 relative z-20 py-3.5 flex items-center justify-between gap-3 md:gap-6">
                
                <!-- Left Profile Jewelry Pendant Button (Bow removed) -->
                <div class="relative flex items-center justify-center shrink-0">
                    <button @click="changePage('home')" aria-label="Profile Pendant" class="w-[46px] h-[46px] md:w-[52px] md:h-[52px] rounded-full bg-surface-primary border-[1.5px] border-border-primary shadow-sm flex items-center justify-center interactive-tap outline-none relative group overflow-hidden">
                        <div class="absolute inset-[2px] rounded-full border border-dashed border-border-primary/60"></div>
                        <div class="w-[36px] h-[36px] md:w-[42px] md:h-[42px] rounded-full overflow-hidden bg-site-bg relative z-20 flex items-center justify-center shadow-inner">
                            <img v-if="media.profile.src" :src="media.profile.src" class="w-full h-full object-cover" alt="Profile">
                            <i v-else class="fas fa-user text-[14px] md:text-[15px]" :style="{ color: activeTheme.textSecondary }"></i>
                        </div>
                    </button>
                    <div class="absolute -bottom-[6px] left-1/2 -translate-x-1/2 w-[5px] h-[5px] rounded-full border border-border-primary bg-surface-primary z-20 shadow-xs"></div>
                </div>

                <!-- Center Opaque Princess Label Frame with responsive max-width and single top bow -->
                <div class="flex flex-col justify-center items-center text-center px-1 relative flex-grow max-w-[480px]">
                    <div class="absolute -top-[11px] left-1/2 -translate-x-1/2 w-[26px] h-[26px] z-30 pointer-events-none animate-bow-flutter drop-shadow-xs">
                        <svg viewBox="0 0 24 24" class="w-full h-full"><use href="#satin-bow-pink"/></svg>
                    </div>

                    <div class="relative w-full max-w-[280px] sm:max-w-[340px] md:max-w-[440px] px-4 py-2.5 md:py-3 rounded-[26px] border-[1.5px] border-border-primary shadow-card-sm flex flex-col items-center justify-center overflow-hidden mx-auto" :style="{ backgroundColor: activeTheme.surfacePrimary }">
                        <div class="absolute inset-[3px] rounded-[22px] border border-dashed border-border-primary/50 pointer-events-none"></div>
                        <svg class="absolute top-1.5 right-3 w-2.5 h-2.5 opacity-40 animate-pulse" viewBox="0 0 10 10" :style="{ color: activeTheme.primary }"><use href="#sparkle-star"/></svg>
                        <svg class="absolute bottom-1.5 left-3 w-2.5 h-2.5 opacity-40 animate-pulse" viewBox="0 0 10 10" :style="{ color: activeTheme.primary }"><use href="#sparkle-star"/></svg>
                        
                        <h1 class="text-[24px] sm:text-[28px] md:text-[34px] font-script leading-tight drop-shadow-sm mt-0.5" :style="{ color: activeTheme.primary }">{{ texts.shopName }}</h1>
                        <div class="flex items-center gap-2 opacity-90 mt-[-2px]">
                            <span class="w-4 md:w-8 h-[1px]" :style="{ backgroundColor: activeTheme.borderPrimary }"></span>
                            <span class="text-[9.5px] sm:text-[10px] md:text-[11px] font-serif uppercase tracking-widest leading-none font-medium" :style="{ color: activeTheme.textSecondary }">{{ texts.headerSubtitle || 'ART STUDIO & COMMISSION' }}</span>
                            <span class="w-4 md:w-8 h-[1px]" :style="{ backgroundColor: activeTheme.borderPrimary }"></span>
                        </div>
                    </div>
                </div>

                <!-- Right Jewelry Pendant Buttons (Music & Settings - Bows removed) -->
                <div class="flex items-center gap-2.5 justify-end shrink-0">
                    <div class="relative flex items-center justify-center">
                        <button v-if="musicState.enabled" @click="toggleMusic" aria-label="Toggle Music" class="w-[40px] h-[40px] md:w-[46px] md:h-[46px] rounded-full bg-surface-primary border-[1.5px] border-border-primary shadow-sm flex items-center justify-center interactive-tap outline-none group relative overflow-hidden">
                            <div class="absolute inset-[2px] rounded-full border border-dashed border-border-primary/60"></div>
                            <div v-if="isPlaying" class="absolute inset-[2.5px] border border-dotted rounded-full animate-pearl-spin" :style="{ borderColor: activeTheme.primary }"></div>
                            <i class="fas fa-music text-[11px] md:text-[12.5px] transition-all duration-300 relative z-10" :class="isPlaying ? 'opacity-100 scale-105' : 'opacity-70'" :style="{ color: activeTheme.primary }"></i>
                            <div v-if="!isPlaying" class="absolute inset-0 flex items-center justify-center z-20"><div class="w-4 h-[1.5px] rotate-45 rounded-full" :style="{ backgroundColor: activeTheme.primary }"></div></div>
                        </button>
                        <div class="absolute -bottom-[6px] left-1/2 -translate-x-1/2 w-[4px] h-[4px] rounded-full border border-border-primary bg-surface-primary z-20"></div>
                    </div>

                    <div class="relative flex items-center justify-center">
                        <button @click="openAdmin" aria-label="Open Admin" class="w-[40px] h-[40px] md:w-[46px] md:h-[46px] rounded-full bg-surface-primary border-[1.5px] border-border-primary shadow-sm flex items-center justify-center interactive-tap outline-none group relative overflow-hidden">
                            <div class="absolute inset-[2px] rounded-full border border-dashed border-border-primary/60"></div>
                            <i class="fas fa-cog text-[11px] md:text-[12.5px] transition-colors relative z-10" :style="{ color: activeTheme.primary }"></i>
                        </button>
                        <div class="absolute -bottom-[6px] left-1/2 -translate-x-1/2 w-[4px] h-[4px] rounded-full border border-border-primary bg-surface-primary z-20"></div>

  async function uploadBase64(bucket, dataUri, folder, filename = '') {
    if (!dataUri || !dataUri.startsWith('data:')) return dataUri || '';

    const normalized = {'image/jpg':'image/jpeg','audio/mp3':'audio/mpeg',
      'audio/wave':'audio/wav','audio/m4a':'audio/x-m4a'};
    let mime = normalized[hit[1]] || hit[1];
    if (mime === 'application/octet-stream') {
      mime = ({mp3:'audio/mpeg',m4a:'audio/mp4',wav:'audio/wav'})[extFromName] || mime;
    }
    const allowed = {
      'site-images':['image/jpeg','image/png','image/gif'],
      'product-images':['image/jpeg','image/png','image/webp','image/gif'],
      'review-images':['image/jpeg','image/png','image/webp'],
      'music-files':['audio/mpeg','audio/mp4','audio/x-m4a','audio/wav','audio/x-wav']
    };

  async function saveRow(table, old, next) {

    const idbHelper = {
        db: null,
        async init() {
            return new Promise((resolve, reject) => {
                const req = indexedDB.open('YukiCMS_DB_V30', 1);
                req.onupgradeneeded = e => {
                    if(!e.target.result.objectStoreNames.contains('mediaStore')) {
                        e.target.result.createObjectStore('mediaStore');
                    }
                };
                req.onsuccess = e => { this.db = e.target.result; resolve(); };
                req.onerror = () => reject('IDB Failed');
            });
        },
        async set(key, value) {
            if(!this.db) await this.init();
            return new Promise(resolve => {
                const tx = this.db.transaction('mediaStore', 'readwrite');
                tx.objectStore('mediaStore').put(value, key);
                tx.oncomplete = () => resolve(true);
            });
        },
        async get(key) {
            if(!this.db) await this.init();
            return new Promise(resolve => {
                const tx = this.db.transaction('mediaStore', 'readonly');
                const req = tx.objectStore('mediaStore').get(key);
                req.onsuccess = () => resolve(req.result || null);
                req.onerror = () => resolve(null);
            });
        },
        async remove(key) {
            if(!this.db) await this.init();
            return new Promise(resolve => {
                const tx = this.db.transaction('mediaStore', 'readwrite');
                tx.objectStore('mediaStore').delete(key);
                tx.oncomplete = () => resolve(true);
            });
        }

        }
        const num = parseInt(cleanHex, 16);
        const r = (num >> 16) & 255;
        const g = (num >> 8) & 255;
        const b = num & 255;

        const toHex = (nr, ng, nb) => '#' + [nr, ng, nb].map(x => {
            const hexStr = Math.max(0, Math.min(255, Math.round(x))).toString(16);
            return hexStr.length === 1 ? '0' + hexStr : hexStr;
        }).join('');

        const primary = toHex(r, g, b);
        const luminance = (0.2126 * r + 0.7152 * g + 0.0722 * b) / 255;
        const textAnchor = luminance > 0.78 ? [116, 99, 111] : [r, g, b];
        const textPrimary = toHex(
            textAnchor[0] * 0.67 + 122 * 0.33,
            textAnchor[1] * 0.67 + 107 * 0.33,
            textAnchor[2] * 0.67 + 117 * 0.33
        );
        const textSecondary = toHex(
            textAnchor[0] * 0.50 + 151 * 0.50,
            textAnchor[1] * 0.50 + 132 * 0.50,
            textAnchor[2] * 0.50 + 143 * 0.50
        );

        const bgR = 255 - (255 - r) * 0.04;
        const bgG = 255 - (255 - g) * 0.04;
        const bgB = 255 - (255 - b) * 0.04;
        const siteBg = toHex(bgR, bgG, bgB);

        const secR = 255 - (255 - r) * 0.22;
        const secG = 255 - (255 - g) * 0.22;
        const secB = 255 - (255 - b) * 0.22;

        const acG = 221 - (221 - g) * 0.3;
        const acB = 241 - (241 - b) * 0.3;
        const accent = toHex(acR, acG, acB);

        const bpR = 232 - (232 - r) * 0.35;
        const bpG = 199 - (199 - g) * 0.35;
        const bpB = 211 - (211 - b) * 0.35;
        const borderPrimary = toHex(bpR, bpG, bpB);

        const bsR = 243 - (243 - r) * 0.25;
        const bsG = 213 - (213 - g) * 0.25;
        const bsB = 226 - (226 - b) * 0.25;
        const borderSecondary = toHex(bsR, bsG, bsB);

        const stR = Math.min(255, r * 1.1);
        const stG = Math.max(80, g * 0.7);
        const stB = Math.max(100, b * 0.8);
        const status = toHex(stR, stG, stB);

        return {
            siteBg,
            surfacePrimary: '#FFFDFD',
            surfaceSecondary,
            primary,
            accent,
            textPrimary,
            textSecondary,
            borderPrimary,
            borderSecondary,

                }
                if(newName !== oldCat && draftCategories.value.includes(newName)) {
                    showNotify('มีชื่อหมวดหมู่นี้อยู่แล้ว');
                    return;
                }

                YukiCloud.noteRenameCategory(oldCat, newName);
                const idx = draftCategories.value.indexOf(oldCat);
                if(idx > -1) {
                    draftCategories.value[idx] = newName;
                }

                draftProducts.value.forEach(p => {
                    if(p.category === oldCat) {
                        p.category = newName;
                    }
                });

                draftReviews.value.forEach(r => {
                    if(r.serviceTag === oldCat) {
                        r.serviceTag = newName;
                    }
                });

                editingCategoryOldName.value = null;
                editingCategoryNewName.value = '';
                showNotify('เปลี่ยนชื่อหมวดหมู่สำเร็จ (กดบันทึกด้านบนเพื่อบันทึกถาวร)');
            };

            const saveProduct = () => {
                const idx = draftProducts.value.findIndex(p => p.id === editObj.value.id);
                if(idx > -1) draftProducts.value[idx] = {...editObj.value};
                else draftProducts.value.push({...editObj.value});
                editObj.value = null;
                showNotify('บันทึกสินค้าลงใน Draft แล้ว');
            };

            const handleProductImageUpload = (e) => {
                const file = e.target.files[0];
                if(!file) return;
                const reader = new FileReader();
                reader.onload = (event) => { if(editObj.value) editObj.value.image = event.target.result; };
                reader.readAsDataURL(file);
            };

            const openAddOrderModal = () => {
                let nextNo = 1;
                if (draftQueues.value.length > 0) {
                    const maxNo = Math.max(...draftQueues.value.map(q => Number(q.queueNo) || 0));
                    nextNo = maxNo + 1;
                }
                editObj.value = {
                    id: Date.now(),
                    queueNo: nextNo,
                    name: '',
                    status: 'รอคิว',
                    channel: availableSocialChannels[0] || 'Instagram',
                    date: new Date().toISOString().split('T')[0],
                    category: draftCategories[0] || 'วาดรูป',
                    note: '',
                    expanded: true
                };
                Object.keys(orderErrors).forEach(k => delete orderErrors[k]);
            };

            const editOrderObj = (q) => {
                editObj.value = { ...q, queueNo: q.queueNo !== undefined && q.queueNo !== null ? q.queueNo : (parseInt(String(q.id).slice(-2), 10) || 1) };
                Object.keys(orderErrors).forEach(k => delete orderErrors[k]);
            };

            const saveOrder = () => {
                Object.keys(orderErrors).forEach(k => delete orderErrors[k]);
                let hasErr = false;
                const qNo = Number(editObj.value.queueNo);
                if (isNaN(qNo) || qNo <= 0) {
                    orderErrors.queueNo = 'กรุณากรอกเลขคิวเป็นตัวเลขจำนวนเต็มบวก';
                    hasErr = true;
                } else {
                    const existing = draftQueues.value.find(q => Number(q.queueNo) === qNo && q.id !== editObj.value.id);
                    if (existing) {
                        orderErrors.queueNo = 'เลขคิวนี้ซ้ำกับรายการอื่น กรุณาเปลี่ยนเลขคิว';
                        hasErr = true;
                    }
                }
                if(!editObj.value.name || !editObj.value.name.trim()) {
                    orderErrors.name = 'กรุณากรอกชื่อลูกค้า';
                    hasErr = true;
                }
                if(!editObj.value.status || !editObj.value.status.trim()) {
                    orderErrors.status = 'กรุณากรอกสถานะปัจจุบัน';
                    hasErr = true;
                }
                if(!editObj.value.category) {
                    orderErrors.category = 'กรุณาเลือกหมวดหมู่บริการ';
                    hasErr = true;
                }
                if(!editObj.value.channel) {
                    orderErrors.channel = 'กรุณาเลือกช่องทางที่สั่ง';
                    hasErr = true;
                }
                if(!editObj.value.date) {
                    orderErrors.date = 'กรุณาเลือกวันที่สั่ง';
                    hasErr = true;
                }
                if(hasErr) return;

                const idx = draftQueues.value.findIndex(q => q.id === editObj.value.id);
                if(idx > -1) draftQueues.value[idx] = {...editObj.value, queueNo: qNo, expanded: true};
                else draftQueues.value.push({...editObj.value, queueNo: qNo, expanded: true});
                editObj.value = null;
                showNotify('บันทึกคิวงานลงใน Draft แล้ว');
            };

            const handleMusicFileUpload = (e) => {
                const file = e.target.files[0];
                if(!file) return;
                
                const fileName = file.name || '';
                const fileExt = fileName.split('.').pop().toLowerCase();
                const fileType = (file.type || '').toLowerCase();
                
                const isMp3 = fileType.includes('audio/mpeg') || fileType.includes('audio/mp3') || fileExt === 'mp3' || fileExt === 'wav' || fileExt === 'm4a';
                if(!isMp3 && fileExt !== 'mp3') {
                    showNotify('กรุณาเลือกไฟล์เพลง .mp3, .m4a หรือ .wav');
                    return;
                }

                const reader = new FileReader();
                reader.onload = (event) => {
                    draftMusicTempFile.value = event.target.result;
                    draftMusicTempFileName.value = fileName;
                    showNotify('โหลดไฟล์เพลงสำเร็จ');
                };
                reader.readAsDataURL(file);
            };

            const addMusicTrack = () => {
                if(!draftMusicTempFile.value || !draftMusicTempFileName.value) {
                    showNotify('กรุณาเลือกไฟล์เพลงก่อน');
                    return;
                }
                const autoName = draftMusicTempFileName.value;
                const newId = 'track_' + Date.now();
                draftMusicList.value.push({
                    id: newId,
                    name: autoName,
                    src: draftMusicTempFile.value
                });
                if(!draftMusicActiveId.value) {
                    draftMusicActiveId.value = newId;
                }
                draftMusicTempFile.value = null;
                draftMusicTempFileName.value = '';
                showNotify('เพิ่มเพลงลงใน Draft สำเร็จ');
            };

            const selectMusicTrack = (id) => {
                draftMusicActiveId.value = id;
                showNotify('เลือกเพลงนี้แล้ว (กดบันทึกการเปลี่ยนแปลงเพื่อใช้จริง)');
            };

            const handleFileUpload = (key, event) => {
                const file = event.target.files[0];
                if(!file) return;
                const reader = new FileReader();
                reader.onload = (e) => {
                    draftMedia[key].src = e.target.result;
                    showNotify('อัปโหลดรูปภาพเข้า Draft สำเร็จ');
                };
                reader.readAsDataURL(file);
            };

            const handleProfileImageUpload = (e) => {
                const file = e.target.files[0];
                if(!file) return;
                const reader = new FileReader();
                const generation = reviewUploadGeneration;
                reader.onload = (event) => { if (generation === reviewUploadGeneration) newReview.profileImage = event.target.result; };
                reader.readAsDataURL(file);
                e.target.value = '';
            };

            const handleReviewImagesUpload = (e) => {
                const files = e.target.files;
                if(!files || files.length === 0) return;
                for(let file of files) {
                    if(newReview.reviewImages.length >= 3) break;
                    const reader = new FileReader();
                    const generation = reviewUploadGeneration;
                    reader.onload = (event) => {
                        if(generation === reviewUploadGeneration && newReview.reviewImages.length < 3) newReview.reviewImages.push(event.target.result);
                    };
                    reader.readAsDataURL(file);
                }
                e.target.value = '';
            };

            const removeReviewImage = (index) => { newReview.reviewImages.splice(index, 1); };

            const openLightbox = (imagesArr, index) => {
                lightbox.images = imagesArr;
                lightbox.currentIndex = index;
                lightbox.show = true;
            };

            const closeLightbox = () => {
                lightbox.show = false;
                lightbox.images = [];
                lightbox.currentIndex = 0;
            };

            const prevLightboxImage = () => {
                if(lightbox.currentIndex > 0) lightbox.currentIndex--;
                else lightbox.currentIndex = lightbox.images.length - 1;
            };

            const nextLightboxImage = () => {
                if(lightbox.currentIndex < lightbox.images.length - 1) lightbox.currentIndex++;
                else lightbox.currentIndex = 0;
            };

            const confirmDelete = (type, id = null) => {
                deleteModal.type = type;
                deleteModal.id = id;
                deleteModal.show = true;
            };

            const executeDelete = async () => {
                if(deleteModal.type === 'media') {
                    draftMedia[deleteModal.id].src = '';
                } else if (deleteModal.type === 'category') {
                    const catName = deleteModal.id;
                    draftCategories.value = draftCategories.value.filter(c => c !== catName);
                } else if (deleteModal.type === 'product') {
                    draftProducts.value = draftProducts.value.filter(p => p.id !== deleteModal.id);
                } else if (deleteModal.type === 'order') {
                    draftQueues.value = draftQueues.value.filter(q => q.id !== deleteModal.id);
                } else if (deleteModal.type === 'point') {
                    draftPoints.value = draftPoints.value.filter(p => p.id !== deleteModal.id);
                } else if (deleteModal.type === 'review') {
                    draftReviews.value = draftReviews.value.filter(r => r.id !== deleteModal.id);
                } else if (deleteModal.type === 'music') {
                    draftMusicList.value = draftMusicList.value.filter(t => t.id !== deleteModal.id);
                    if(draftMusicActiveId.value === deleteModal.id) {
                        draftMusicActiveId.value = null;
                    }
                }
                deleteModal.show = false;
                showNotify('ลบออกจาก Draft สำเร็จ');
            };

            const resetReviewForm = () => {
                reviewUploadGeneration++;
                Object.assign(newReview, {
                    name: '', text: '', rating: 5, serviceTag: '',
                    profileImage: '', reviewImages: []
                });
                document.querySelectorAll('[data-review-upload]').forEach(input => { input.value = ''; });
            };

            const submitReview = async () => {
                if (reviewSubmitting.value) return;
                if (!newReview.name.trim()) return showNotify('กรุณากรอกชื่อของคุณ');
                if (!newReview.text.trim()) return showNotify('กรุณาเขียนรีวิว');
                if (newReview.rating <= 2 && !newReview.reviewImages.length)
                    return showNotify('กรุณาแนบรูปหลักฐานอย่างน้อย 1 รูป');
                reviewSubmitting.value = true;
                try {
                    const data = await YukiCloud.submitReview({...newReview,reviewImages:[...newReview.reviewImages]});
                    applyPublicData(data);
                    resetReviewForm();
                    isReviewFormOpen.value = false;
                    showNotify('♡ ส่งรีวิวเรียบร้อยแล้ว ♡');
                } catch(e) {
                    console.error('Review submission error:',e);
                    showNotify('ส่งรีวิวไม่สำเร็จ: '+(e.message||'กรุณาลองอีกครั้ง'));
                } finally { reviewSubmitting.value = false; }
            };

            const getPageTitle = () => { const m = { products: texts.nav01Title, reviews: texts.nav02Title, queue: texts.nav03Title, points: texts.nav04Title }; return m[currentPage.value] || ''; };
            const getPageSubtitle = () => { const m = { products: texts.nav01TitleEn, reviews: texts.nav02TitleEn, queue: texts.nav03TitleEn, points: texts.nav04TitleEn }; return m[currentPage.value] || ''; };

            return {
                isLoaded, currentPage, notification, showAuth, pinInput, adminEmail, adminMainTab, activeTextPage, subTextPage, dataSubTab, activeAccordion, deleteModal, editObj, orderErrors,
                texts, draftTexts, textFieldsMeta, searchFilteredFields, textSearchQuery, media, draftMedia, products, draftProducts, productCategories, draftCategories, reviews, draftReviews, queues, draftQueues, draftQueuesSorted, points, draftPoints, newReview, lightbox,
                queueSearch, pointsSearch, productSearch, filteredQueues, filteredProducts, activeCategory, selectedProduct,
                draftNewCategoryName, isReviewFormOpen, reviewSubmitting, reviewFilter, filteredReviews,
                averageRating, ratingDescription, availableSocialChannels, activeSocialChannels, socialLinks, draftSocialLinks,
                musicList, draftMusicList, musicActiveId, draftMusicActiveId, draftMusicTempFile, draftMusicTempFileName, addMusicTrack, selectMusicTrack, handleMusicFileUpload,
                bullets, draftBullets, effectiveBullets, addDraftBullet, removeDraftBullet,
                editingCategoryOldName, editingCategoryNewName, startRenameCategory, confirmRenameCategory,
                formatDate, getSocialIcon,
                musicState, isPlaying, toggleMusic,
                toggleQueueExpand,
                checkPin, openAdmin, handleAdminExit, handleAdminBack, changePage, saveAllData, isSavingAll,
                addCategory, saveProduct, handleProductImageUpload, openAddOrderModal, editOrderObj, saveOrder,
                handleFileUpload, handleProfileImageUpload, handleReviewImagesUpload, removeReviewImage,
                openLightbox, closeLightbox, prevLightboxImage, nextLightboxImage,
                confirmDelete, executeDelete, submitReview,
                getPageTitle, getPageSubtitle,
                pointsSettings, draftPointsSettings, draftRewardsList, draftNewMember, matchedMember, sortedRewards,
                addDraftReward, removeDraftReward, addNewMember, adjustMemberPoints, openAddHistoryModal, editMemberHistory, deleteMemberHistory,
                historyModal, historyDeleteModal, submitHistoryModal, executeDeleteHistory,
                formatRemainingPoints, draftThemeBase, draftThemePalette, resetTheme, activeTheme
            };
        }
    }).mount('#app');
</script>
</body>
</html>
